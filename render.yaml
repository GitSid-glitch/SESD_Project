services:
  - type: web
    name: smart-project-management-system
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/src/scripts/seed.js && node dist/src/server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: TOKEN_SECRET
        generateValue: true
